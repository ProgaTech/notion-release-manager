name: Release Manager - Main

on:
  workflow_call:
    inputs:
      release_stage_property:
        description: "Notion property name for release stage"
        required: false
        type: string
        default: "Status"
      release_property:
        description: "Notion property name for release relation"
        required: false
        type: string
        default: "Release"
      release_stage_prod:
        description: "Release stage value for prod environment"
        required: false
        type: string
        default: "On Prod"
      next_release_name:
        description: "Name for the next/pending release"
        required: false
        type: string
        default: "Next Release"
      release_status_next:
        description: "Release status value for next/pending releases"
        required: false
        type: string
        default: "Next"
      release_status_released:
        description: "Release status value for released versions"
        required: false
        type: string
        default: "Released"
      release_label_property:
        description: "Notion property name for release labels"
        required: false
        type: string
        default: "Release Label"
      release_label_major:
        description: "PR label for major version bump"
        required: false
        type: string
        default: "Major"
      release_label_minor:
        description: "PR label for minor version bump"
        required: false
        type: string
        default: "Minor"
      release_label_patch:
        description: "PR label for patch version bump"
        required: false
        type: string
        default: "Patch"
      release_stage_dev:
        description: "Release stage value for dev environment"
        required: false
        type: string
        default: "On Dev"
      repos_property:
        description: "Notion property name for tracking repos in a release"
        required: false
        type: string
        default: "Repositories"
      repo_identifier:
        description: "Identifier for this repository (e.g., 'api', 'ui', 'web')"
        required: true
        type: string
      required_repos:
        description: "Comma-separated list of repo identifiers that must be included for a release to be considered complete (e.g., 'api,ui' or 'api,ui,web')"
        required: false
        type: string
        default: ""
      status_partially_released:
        description: "Release status value for partially released versions"
        required: false
        type: string
        default: "Partially Released"
      status_rank:
        description: "Ordered, comma-separated status names, lowest first (e.g. 'Partially On Dev,On Dev,On Prod'). When set, a task is never moved to a status ranked below its current one. Empty disables the guard."
        required: false
        type: string
        default: ""
    secrets:
      NOTION_API_TOKEN:
        required: true
      NOTION_TASKS_DATABASE_ID:
        required: true
      NOTION_RELEASES_DATABASE_ID:
        required: true

permissions:
  contents: write
  pull-requests: read

jobs:
  promote-to-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_STAGE_PROPERTY: ${{ inputs.release_stage_property }}
      RELEASE_PROPERTY: ${{ inputs.release_property }}
      RELEASE_STAGE_PROD: ${{ inputs.release_stage_prod }}
      NEXT_RELEASE_NAME: ${{ inputs.next_release_name }}
      RELEASE_STATUS_NEXT: ${{ inputs.release_status_next }}
      RELEASE_STATUS_RELEASED: ${{ inputs.release_status_released }}
      RELEASE_LABEL_PROPERTY: ${{ inputs.release_label_property }}
      RELEASE_LABEL_MAJOR: ${{ inputs.release_label_major }}
      RELEASE_LABEL_MINOR: ${{ inputs.release_label_minor }}
      RELEASE_LABEL_PATCH: ${{ inputs.release_label_patch }}
      RELEASE_STAGE_DEV: ${{ inputs.release_stage_dev }}
      REPOS_PROPERTY: ${{ inputs.repos_property }}
      REPO_IDENTIFIER: ${{ inputs.repo_identifier }}
      REQUIRED_REPOS: ${{ inputs.required_repos }}
      STATUS_PARTIALLY_RELEASED: ${{ inputs.status_partially_released }}
      STATUS_RANK: ${{ inputs.status_rank }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote to release
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require("child_process");
            function tryExec(cmd) {
              try {
                return execSync(cmd).toString().trim();
              } catch {
                return "";
              }
            }

            async function sleep(ms) {
              return new Promise(r => setTimeout(r, ms));
            }

            const notionApi = "https://api.notion.com/v1";
            const notionToken = "${{ secrets.NOTION_API_TOKEN }}";
            const tasksDB = "${{ secrets.NOTION_TASKS_DATABASE_ID }}";
            const releasesDB = "${{ secrets.NOTION_RELEASES_DATABASE_ID }}";

            const headers = {
              "Authorization": `Bearer ${notionToken}`,
              "Notion-Version": "2022-06-28",
              "Content-Type": "application/json"
            };

            async function queryNotionDB(db, body) {
              const res = await fetch(`${notionApi}/databases/${db}/query`, {
                method: "POST",
                headers,
                body: JSON.stringify(body)
              });
              if (!res.ok) throw new Error(`Query failed: ${res.status} ${await res.text()}`);
              return res.json();
            }

            async function patchPage(pageId, properties) {
              const res = await fetch(`${notionApi}/pages/${pageId}`, {
                method: "PATCH",
                headers,
                body: JSON.stringify({ properties })
              });
              if (!res.ok) throw new Error(`Patch failed: ${res.status} ${await res.text()}`);
              return res.json();
            }

            async function createPage(db, properties) {
              const res = await fetch(`${notionApi}/pages`, {
                method: "POST",
                headers,
                body: JSON.stringify({ parent: { database_id: db }, properties })
              });
              if (!res.ok) throw new Error(`Create failed: ${res.status} ${await res.text()}`);
              return res.json();
            }

            async function getLatestReleasedVersion() {
              const statusReleased = process.env.RELEASE_STATUS_RELEASED;
              const statusPartiallyReleased = process.env.STATUS_PARTIALLY_RELEASED;
              
              // Query for both "Released" and "Partially Released" statuses
              const filter = {
                or: [
                  { property: "Status", status: { equals: statusReleased } }
                ]
              };
              
              if (statusPartiallyReleased) {
                filter.or.push({ property: "Status", status: { equals: statusPartiallyReleased } });
              }
              
              const res = await queryNotionDB(releasesDB, {
                filter,
                sorts: [{ property: "Version", direction: "descending" }]
              });
              
              if (!res.results.length) return "0.0.0";
              const version = res.results[0].properties.Version.title[0].plain_text;
              const status = res.results[0].properties.Status.status.name;
              return { version, status };
            }

            async function ensureReleaseWithRepoTracking(version, repoIdentifier, reposProperty, requiredReposList, statusPartiallyReleased, statusReleased) {
              // Check if release already exists
              const found = await queryNotionDB(releasesDB, {
                filter: { property: "Version", title: { equals: version } }
              });

              let releasePage;
              let isNewRelease = false;

              if (found.results.length) {
                releasePage = found.results[0];
              } else {
                // Create new release
                // Determine initial status: if no required repos or only current repo required, set to "Released", otherwise "Partially Released"
                const initialStatus = (requiredReposList.length === 0 || (requiredReposList.length === 1 && requiredReposList.includes(repoIdentifier))) 
                  ? statusReleased 
                  : statusPartiallyReleased;
                
                const properties = {
                  Version: { title: [{ text: { content: version } }] },
                  Status: { status: { name: initialStatus } },
                  "Release Date": { date: { start: new Date().toISOString() } },
                  [reposProperty]: {
                    multi_select: [{ name: repoIdentifier }]
                  }
                };

                releasePage = await createPage(releasesDB, properties);
                isNewRelease = true;
                console.log(`Created new release ${version} with repo "${repoIdentifier}"`);
              }

              const releaseId = releasePage.id;
              const reposProp = releasePage.properties[reposProperty];
              
              // Get current repos list from multi_select
              const currentRepos = (reposProp?.multi_select || []).map(r => r.name);

              // Check if this repo is already in the list
              const repoAlreadyIncluded = currentRepos.includes(repoIdentifier);
              
              if (!repoAlreadyIncluded) {
                // Add this repo to the list
                currentRepos.push(repoIdentifier);
                
                // Check if all required repos are now included
                // If no required repos specified, mark as "Released" after first repo
                const allRequiredReposIncluded = requiredReposList.length === 0 || 
                  requiredReposList.every(reqRepo => currentRepos.includes(reqRepo));
                
                const newStatus = allRequiredReposIncluded ? statusReleased : statusPartiallyReleased;
                
                const updateProps = {
                  [reposProperty]: {
                    multi_select: currentRepos.map(r => ({ name: r }))
                  },
                  Status: { status: { name: newStatus } }
                };

                await patchPage(releaseId, updateProps);
                
                if (allRequiredReposIncluded) {
                  if (requiredReposList.length === 0) {
                    console.log(`No required repos specified. Updated status to "Released"`);
                  } else {
                    console.log(`All required repos (${requiredReposList.join(', ')}) are included. Updated status to "Released"`);
                  }
                } else {
                  const missingRepos = requiredReposList.filter(r => !currentRepos.includes(r));
                  console.log(`Missing repos: ${missingRepos.join(', ')}. Status set to "Partially Released"`);
                }
                console.log(`Added repo "${repoIdentifier}" to release ${version}`);
              } else {
                console.log(`Repo "${repoIdentifier}" already in release ${version}`);
              }

              return {
                releaseId,
                repoAlreadyIncluded: repoAlreadyIncluded && !isNewRelease, // If this is a new release we just created, we need to process it even though repo is already included
                currentRepos
              };
            }

            async function getNextReleaseTasks() {
              const tasks = await queryNotionDB(tasksDB, {
                filter: {
                  and: [
                    { property: RELEASE_REL_PROP, relation: { contains: nextReleaseId } },
                    { property: RELEASE_STAGE_PROP, status: { equals: DEV_STAGE } }
                  ]
                }
              });
              return tasks.results;
            }

            function bumpVersion(base, strategy) {
              const p = base.split(".").map(Number);
              if (strategy === "major") return `${p[0] + 1}.0.0`;
              if (strategy === "minor") return `${p[0]}.${p[1] + 1}.0`;
              return `${p[0]}.${p[1]}.${p[2] + 1}`;
            }

            function maxBump(a, b) {
              const order = { patch: 0, minor: 1, major: 2 };
              return order[b] > order[a] ? b : a;
            }

            // Current value of a status-type property, or null when unset
            function currentStatusName(task, prop) {
              const p = task.properties[prop];
              return p && p.type === "status" && p.status ? p.status.name : null;
            }

            // True when writing `target` onto `task` would move it down the rank.
            // Equal ranks proceed, so re-runs still refresh notes and relations.
            // An empty rank list, or a status missing from it, always proceeds.
            function isBackwardMove(task, prop, target) {
              if (!STATUS_RANK.length) return false;
              const from = STATUS_RANK.indexOf(currentStatusName(task, prop));
              const to = STATUS_RANK.indexOf(target);
              if (from === -1 || to === -1) return false;
              return to < from;
            }

            const RELEASE_STAGE_PROP = process.env.RELEASE_STAGE_PROPERTY;
            const RELEASE_REL_PROP = process.env.RELEASE_PROPERTY;
            const RELEASE_LABEL_PROP = process.env.RELEASE_LABEL_PROPERTY;
            const DEV_STAGE = process.env.RELEASE_STAGE_DEV;
            const PROD_STAGE = process.env.RELEASE_STAGE_PROD;
            const RELEASE_LABEL_MAJOR = process.env.RELEASE_LABEL_MAJOR;
            const RELEASE_LABEL_MINOR = process.env.RELEASE_LABEL_MINOR;
            const RELEASE_LABEL_PATCH = process.env.RELEASE_LABEL_PATCH;
            const nextReleaseName = process.env.NEXT_RELEASE_NAME;
            const statusNext = process.env.RELEASE_STATUS_NEXT;
            const statusReleased = process.env.RELEASE_STATUS_RELEASED;
            const reposProperty = process.env.REPOS_PROPERTY;
            const repoIdentifier = process.env.REPO_IDENTIFIER;
            const requiredReposStr = process.env.REQUIRED_REPOS || "";
            const requiredReposList = requiredReposStr 
              ? requiredReposStr.split(',').map(r => r.trim()).filter(r => r)
              : [];
            const statusPartiallyReleased = process.env.STATUS_PARTIALLY_RELEASED;
            const STATUS_RANK = (process.env.STATUS_RANK || "")
              .split(",").map(s => s.trim()).filter(Boolean);

            console.log(`Processing release for repo: ${repoIdentifier}`);
            if (requiredReposList.length > 0) {
              console.log(`Required repos for complete release: ${requiredReposList.join(', ')}`);
            }

            // Ensure "Next Release" exists (for task queries)
            async function ensureRelease(version, status) {
              const found = await queryNotionDB(releasesDB, {
                filter: { property: "Version", title: { equals: version } }
              });
              if (found.results.length) return found.results[0].id;
              const page = await createPage(releasesDB, {
                Version: { title: [{ text: { content: version } }] },
                Status: { status: { name: status } },
                "Release Date": { date: { start: new Date().toISOString() } }
              });
              return page.id;
            }

            const nextReleaseId = await ensureRelease(nextReleaseName, statusNext);
            console.log(`Pending release page: "${nextReleaseName}" (${nextReleaseId})`);

            // Get latest released version from Notion (source of truth)
            const { version: latest, status: latestStatus } = await getLatestReleasedVersion();
            console.log(`Latest released version from Notion: ${latest} (status: ${latestStatus})`);

            // Determine version bump based on Release Note labels from Notion tasks
            // Only consider tasks that are fully on dev (not partially)
            let calculatedBump = "patch";
            let nextReleaseTasks = [];
            try {
              nextReleaseTasks = await getNextReleaseTasks();

              console.log(`Found ${nextReleaseTasks.length} tasks in "${nextReleaseName}" on dev for bump calculation`);

              for (const task of nextReleaseTasks) {
                const releaseLabelProp = task.properties[RELEASE_LABEL_PROP];
                if (!releaseLabelProp || releaseLabelProp.type !== 'select' || !releaseLabelProp.select) {
                  // No label set, default to patch
                  calculatedBump = maxBump(calculatedBump, "patch");
                  continue;
                }

                const labelValue = releaseLabelProp.select.name;
                console.log(`Task ${task.id} has Release Label: "${labelValue}"`);

                if (labelValue === RELEASE_LABEL_MAJOR) {
                  calculatedBump = maxBump(calculatedBump, "major");
                } else if (labelValue === RELEASE_LABEL_MINOR) {
                  calculatedBump = maxBump(calculatedBump, "minor");
                } else if (labelValue === RELEASE_LABEL_PATCH) {
                  calculatedBump = maxBump(calculatedBump, "patch");
                } else {
                  // Unknown label, default to patch
                  calculatedBump = maxBump(calculatedBump, "patch");
                }
              }

              console.log(`Version bump determined from Notion task labels: ${calculatedBump}`);
            } catch (e) {
              console.log(`Error determining bump from Notion tasks: ${e.message}, defaulting to patch`);
            }

            // If the latest version is partially released, we don't need to bump the version to another one
            const nextVersion = latestStatus === statusPartiallyReleased ? latest : bumpVersion(latest, calculatedBump);
            console.log(`Next version: ${nextVersion} (base: ${latest}, bump: ${calculatedBump})`);

            // Ensure release exists and track this repo
            const releaseInfo = await ensureReleaseWithRepoTracking(
              nextVersion,
              repoIdentifier,
              reposProperty,
              requiredReposList,
              statusPartiallyReleased,
              statusReleased
            );
            const prodReleaseId = releaseInfo.releaseId;

            // Only promote tasks if this is the first time repo is processing for this release,
            // to prevents duplicate task promotions when multiple repos trigger
            if (!releaseInfo.repoAlreadyIncluded && nextReleaseTasks.length > 0) {
              try {
                console.log(`Promoting ${nextReleaseTasks.length} tasks from "${nextReleaseName}" to ${nextVersion}`);
                
                for (const task of nextReleaseTasks) {
                  try {
                    if (isBackwardMove(task, RELEASE_STAGE_PROP, PROD_STAGE)) {
                      console.log(`Task ${task.id}: current status "${currentStatusName(task, RELEASE_STAGE_PROP)}" ranks above "${PROD_STAGE}" → skipping`);
                      continue;
                    }
                    const props = {
                      [RELEASE_REL_PROP]: { relation: [{ id: prodReleaseId }] },
                      [RELEASE_STAGE_PROP]: { status: { name: PROD_STAGE } },
                    };
                    await patchPage(task.id, props);
                    await sleep(300);
                  } catch (e) {
                    console.log(`Error promoting task ${task.id}: ${e.message}`);
                  }
                }
              } catch (e) {
                console.log(`Error querying tasks for promotion: ${e.message}`);
              }
            } else if (releaseInfo.repoAlreadyIncluded) {
              console.log(`Tasks already promoted by another repo. Skipping task promotion.`);
            }

            // Only create git tag if repo is not already in the release,
            // to ensure each repo only tags once per version
            if (!releaseInfo.repoAlreadyIncluded) {
              try {
                execSync(`git config user.name "GitHub Actions"`);
                execSync(`git config user.email "actions@github.com"`);
                const tagName = `v${nextVersion}`;
                const exists = tryExec(`git rev-parse ${tagName}`);
                if (!exists) {
                  execSync(`git tag -a ${tagName} -m "Release ${tagName} (repo: ${repoIdentifier})"`);
                  execSync(`git push origin ${tagName}`);
                  console.log(`Created git tag ${tagName} for repo ${repoIdentifier}`);
                } else {
                  console.log(`Tag ${tagName} already exists in this repo, skipping creation`);
                }
              } catch (e) {
                console.log(`Error creating git tag: ${e.message}`);
              }
            } else {
              console.log(`Repo ${repoIdentifier} already tagged for version ${nextVersion}. Skipping tag creation.`);
            }
