name: Notify Release

on:
  workflow_call:
    inputs:
      release_name:
        type: string
        required: true
        description: "Name/version of the release to notify about"
      release_type:
        type: string
        required: true
        description: "Type of release: dev, stage, or prod"
      task_id_property:
        type: string
        default: "ID"
        description: "Notion property name for task ID"
      task_id_prefix:
        type: string
        default: "STR-"
        description: "Prefix for task IDs"
    secrets:
      NOTION_API_TOKEN:
        required: true
        description: "Notion API token"
      NOTION_RELEASES_DATABASE_ID:
        required: true
        description: "Notion Releases database ID"
      NOTION_TASKS_DATABASE_ID:
        required: true
        description: "Notion Tasks database ID"
      SLACK_WEBHOOK_URL:
        required: true
        description: "Slack webhook URL"
    outputs:
      success:
        description: "Whether notification was sent successfully"
        value: ${{ jobs.notify.outputs.success }}

jobs:
  notify:
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.send-notification.outputs.success }}
    steps:
      - name: Send Slack Notification
        id: send-notification
        uses: ProgaTech/notion-release-manager/.github/actions/slack-notifier@feature/refine-workflow'
        with:
          release_name: ${{ inputs.release_name }}
          release_type: ${{ inputs.release_type }}
          task_id_property: ${{ inputs.task_id_property }}
          task_id_prefix: ${{ inputs.task_id_prefix }}
          notion_token: ${{ secrets.NOTION_API_TOKEN }}
          releases_database_id: ${{ secrets.NOTION_RELEASES_DATABASE_ID }}
          tasks_database_id: ${{ secrets.NOTION_TASKS_DATABASE_ID }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
